<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Produto - Hortifruti Premium</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">

    <div class="card shadow p-4 rounded-4 border-0">
        <h2 class="text-center mb-4 fw-bold text-dark">✏️ Editar Produto</h2>

        <div id="alert-container"></div>

        <form id="edit-product-form" enctype="multipart/form-data">
            <!-- Nome -->
            <div class="mb-3">
                <label class="form-label fw-bold">Nome do Produto</label>
                <input type="text" name="nome" id="nome" class="form-control rounded-3" required>
            </div>

            <!-- Descrição -->
            <div class="mb-3">
                <label class="form-label fw-bold">Descrição</label>
                <textarea name="descricao" id="descricao" class="form-control rounded-3" rows="3"></textarea>
            </div>

            <!-- Preço -->
            <div class="mb-3">
                <label class="form-label fw-bold">Preço</label>
                <input type="text" name="preco" id="preco" class="form-control rounded-3" required>
            </div>

            <!-- Imagem atual -->
            <div class="mb-3 text-center">
                <label class="form-label d-block fw-bold">Imagem Atual</label>
                <img id="imagem-atual" src="" 
                     class="img-fluid rounded shadow-sm" 
                     style="max-width: 200px; display: none;">
                <div id="imagem-placeholder" class="text-muted small">Sem imagem associada</div>
            </div>

            <!-- Nova imagem -->
            <div class="mb-4">
                <label class="form-label fw-bold">Trocar Imagem</label>
                <input type="file" name="imagem" id="imagem" class="form-control rounded-3">
            </div>

            <!-- Botões -->
            <div class="text-center d-flex gap-2 justify-content-center">
                <button type="submit" class="btn btn-success rounded-pill px-4 fw-bold">Salvar Alterações</button>
                <a href="admin_produtos.html" class="btn btn-secondary rounded-pill px-4">Cancelar</a>
            </div>

        </form>
    </div>

</div>

<!-- Scripts -->
<script src="js/config.js"></script>
<script src="js/layout.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        // Proteção de rota
        const user = await checkAuth();
        if (!user || !user.admin) {
            alert("Acesso negado. Apenas administradores.");
            window.location.href = "login.html";
            return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        if (!id) {
            alert("ID de produto não especificado.");
            window.location.href = "admin_produtos.html";
            return;
        }

        carregarDadosProduto(id);

        const form = document.getElementById("edit-product-form");
        form.addEventListener("submit", (e) => salvarAlteracoes(e, id));
    });

    async function carregarDadosProduto(id) {
        try {
            const response = await fetch(`${API_URL}/api/produtos/${id}`);
            if (!response.ok) throw new Error("Erro ao buscar detalhes do produto");

            const produto = await response.json();

            document.getElementById("nome").value = produto.nome;
            document.getElementById("descricao").value = produto.descricao || '';
            document.getElementById("preco").value = parseFloat(produto.preco).toFixed(2).replace('.', ',');

            const imgAtual = document.getElementById("imagem-atual");
            const imgPlaceholder = document.getElementById("imagem-placeholder");

            if (produto.imagem) {
                imgAtual.src = `${API_URL}/static/imagens/${produto.imagem}`;
                imgAtual.style.display = 'inline-block';
                imgPlaceholder.style.display = 'none';
            } else {
                imgAtual.style.display = 'none';
                imgPlaceholder.style.display = 'block';
            }

        } catch (error) {
            console.error(error);
            alert("Não foi possível carregar as informações do produto.");
            window.location.href = "admin_produtos.html";
        }
    }

    async function salvarAlteracoes(event, id) {
        event.preventDefault();
        const alertContainer = document.getElementById("alert-container");
        alertContainer.innerHTML = '';

        const formData = new FormData();
        formData.append("nome", document.getElementById("nome").value);
        formData.append("descricao", document.getElementById("descricao").value);
        formData.append("preco", document.getElementById("preco").value);

        const fileInput = document.getElementById("imagem");
        if (fileInput.files.length > 0) {
            formData.append("imagem", fileInput.files[0]);
        }

        try {
            // Mandamos como POST, o backend aceita POST /api/produtos/<id> para atualizar (facilitando o parse de multipart/form-data)
            const response = await fetch(`${API_URL}/api/produtos/${id}`, {
                method: "POST", 
                headers: {
                    ...getAuthHeaders()
                },
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                alertContainer.innerHTML = `
                    <div class="alert alert-success rounded-3 small py-2">Produto atualizado com sucesso!</div>
                `;
                setTimeout(() => {
                    window.location.href = "admin_produtos.html";
                }, 1500);
            } else {
                alertContainer.innerHTML = `
                    <div class="alert alert-danger rounded-3 small py-2">${data.erro || "Erro ao atualizar produto."}</div>
                `;
            }
        } catch (error) {
            console.error(error);
            alertContainer.innerHTML = `
                <div class="alert alert-danger rounded-3 small py-2">Não foi possível conectar ao servidor.</div>
            `;
        }
    }
</script>
</body>
</html>
