<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalhes do Produto - Hortifruti Premium</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>

    <!-- NAVBAR PLACEHOLDER -->
    <div id="navbar-placeholder"></div>

    <!-- CONTEÚDO -->
    <div class="container mt-5 main-content" style="max-width: 800px;">
        <div id="produto-detalhe">
            <div class="text-center py-5">
                <div class="spinner-border text-success" role="status">
                    <span class="visually-hidden">Carregando...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER PLACEHOLDER -->
    <div id="footer-placeholder"></div>

    <!-- CART PLACEHOLDER -->
    <div id="cart-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/layout.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (!id) {
                document.getElementById("produto-detalhe").innerHTML = `
                    <div class="alert alert-danger text-center">Produto inválido ou ID não especificado.</div>
                `;
                return;
            }

            carregarDetalhesProduto(id);
        });

        async function carregarDetalhesProduto(id) {
            const container = document.getElementById("produto-detalhe");

            try {
                const response = await fetch(`${API_URL}/api/produtos/${id}`);
                if (!response.ok) throw new Error("Produto não encontrado");
                
                const produto = await response.json();
                const user = JSON.parse(localStorage.getItem("user") || "null");
                const isAdmin = user && user.admin;

                const imagemUrl = produto.imagem 
                    ? `${API_URL}/static/imagens/${produto.imagem}` 
                    : `${API_URL}/static/imagens/sem-imagem.png`;

                let editBtn = '';
                if (isAdmin) {
                    editBtn = `<a href="editar.html?id=${produto.id}" class="btn btn-warning btn-sm me-2">Editar</a>`;
                }

                // Montar a mensagem do whatsapp para compra direta deste produto
                const emoji = obterEmojiProduto(produto.nome);
                const msgWhats = `🛒 *NOVO PEDIDO*\n\n${emoji} *${produto.nome}* - R$ ${parseFloat(produto.preco).toFixed(2).replace('.', ',')}\n\nGostaria de finalizar a compra deste item!`;
                const urlWhats = `https://wa.me/5511959589388?text=${encodeURIComponent(msgWhats)}`;

                container.innerHTML = `
                    <div class="card shadow rounded-4 overflow-hidden border-0">
                        <div class="row g-0">
                            <div class="col-md-6">
                                <img src="${imagemUrl}" class="img-fluid w-100 h-100" style="object-fit: cover; min-height: 300px;" alt="${produto.nome}">
                            </div>
                            <div class="col-md-6">
                                <div class="card-body p-4 d-flex flex-column h-100 justify-content-between">
                                    <div>
                                        <h2 class="card-title fw-bold text-dark mb-3">${produto.nome}</h2>
                                        <p class="card-text text-muted mb-4 fs-5">${produto.descricao || 'Sem descrição.'}</p>
                                    </div>
                                    
                                    <div>
                                        <div class="mb-4">
                                            <span class="fs-4 text-success fw-bold">R$ ${parseFloat(produto.preco).toFixed(2).replace('.', ',')}</span>
                                        </div>

                                        <div class="d-flex flex-wrap gap-2 mb-3">
                                            ${editBtn}
                                            <button onclick="adicionarCarrinho('${produto.nome}', '${produto.preco}')" class="btn btn-success rounded-pill px-4">
                                                <i class="fas fa-cart-plus me-2"></i> Adicionar ao Carrinho
                                            </button>
                                        </div>

                                        <a href="${urlWhats}" target="_blank" class="btn btn-outline-success rounded-pill px-4 w-100 mt-2 text-center">
                                            <i class="fab fa-whatsapp me-2"></i> Comprar via WhatsApp Direto
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error(error);
                container.innerHTML = `
                    <div class="alert alert-danger text-center py-4">
                        <i class="fas fa-exclamation-circle fa-2x mb-2 d-block"></i>
                        Produto não encontrado ou erro ao carregar as informações.
                        <a href="index.html" class="d-block mt-3 btn btn-secondary btn-sm">Voltar para a Vitrine</a>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
