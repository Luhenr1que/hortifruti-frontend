<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vitrine - Hortifruti Premium</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>

    <!-- NAVBAR PLACEHOLDER -->
    <div id="navbar-placeholder"></div>

    <!-- CONTEÚDO -->
    <div class="container-fluid mt-4 main-content">
        <header class="text-center py-5">
            <h1 class="display-4 fw-800 text-dark mb-2">Nossa Vitrine</h1>
            <p class="lead text-muted">Produtos frescos colhidos hoje, direto para sua mesa.</p>
        </header>

        <div class="container">
            <div id="product-grid" class="product-grid">
                <!-- Produtos serão carregados aqui via JS -->
                <div class="text-center py-5 w-100 grid-full-width">
                    <div class="spinner-border text-success" role="status">
                        <span class="visually-hidden">Carregando...</span>
                    </div>
                </div>
            </div>

            <!-- PAGINAÇÃO -->
            <div id="pagination-container" class="pagination-container"></div>
        </div>
    </div>

    <!-- FOOTER PLACEHOLDER -->
    <div id="footer-placeholder"></div>

    <!-- CART PLACEHOLDER -->
    <div id="cart-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/layout.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const q = urlParams.get('q') || '';
            const page = urlParams.get('page') || 1;

            carregarProdutos(q, page);
        });

        async function carregarProdutos(q, page) {
            const grid = document.getElementById("product-grid");
            const pagContainer = document.getElementById("pagination-container");

            try {
                const response = await fetch(`${API_URL}/api/produtos?q=${encodeURIComponent(q)}&page=${page}`);
                if (!response.ok) throw new Error("Erro ao carregar produtos");
                
                const data = await response.json();
                const user = JSON.parse(localStorage.getItem("user") || "null");
                const isAdmin = user && user.admin;

                // Renderizar Grid
                if (data.produtos.length === 0) {
                    grid.innerHTML = `
                        <div class="text-center py-5 w-100 grid-full-width">
                            <i class="fas fa-search fa-3x text-muted mb-3"></i>
                            <h3 class="text-muted text-center">Nenhum produto encontrado</h3>
                            <p class="text-center">Tente buscar por outro nome ou <a href="index.html">limpar a busca</a>.</p>
                        </div>
                    `;
                    pagContainer.innerHTML = '';
                    return;
                }

                let html = '';
                data.produtos.forEach(p => {
                    const imagemUrl = p.imagem 
                        ? `${API_URL}/static/imagens/${p.imagem}` 
                        : `${API_URL}/static/imagens/sem-imagem.png`;

                    const adminActions = isAdmin ? `
                        <div class="admin-actions">
                            <a href="editar.html?id=${p.id}" class="btn-edit" title="Editar Produto">
                                <i class="fas fa-edit"></i>
                            </a>
                        </div>
                    ` : '';

                    html += `
                        <div class="product-card">
                            ${adminActions}
                            <div class="product-image-wrapper">
                                <a href="produto.html?id=${p.id}">
                                    <img src="${imagemUrl}" class="product-image" alt="${p.nome}">
                                </a>
                                <div class="product-badge">Fresquinho</div>
                            </div>

                            <div class="product-content">
                                <h3 class="product-title">
                                    <a href="produto.html?id=${p.id}" class="text-decoration-none text-dark">${p.nome}</a>
                                </h3>
                                <p class="product-description">${p.descricao || ''}</p>

                                <div class="product-price-tag">
                                    R$ ${parseFloat(p.preco).toFixed(2).replace('.', ',')}
                                </div>

                                <div class="product-actions">
                                    <button 
                                        class="btn-add-cart"
                                        onclick="adicionarCarrinho('${p.nome}', '${p.preco}')">
                                        <i class="fas fa-cart-plus me-2"></i> Adicionar
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                grid.innerHTML = html;

                // Renderizar Paginação
                let pagHtml = '';
                if (data.pages > 1) {
                    if (data.has_prev) {
                        pagHtml += `<a href="index.html?page=${data.prev_num}&q=${encodeURIComponent(q)}" class="pagination-link"><i class="fas fa-chevron-left me-1"></i> Anterior</a>`;
                    }

                    // Simplificado: mostra todos os números de página
                    for (let i = 1; i <= data.pages; i++) {
                        if (i == data.page) {
                            pagHtml += `<a href="index.html?page=${i}&q=${encodeURIComponent(q)}" class="pagination-link active">${i}</a>`;
                        } else {
                            pagHtml += `<a href="index.html?page=${i}&q=${encodeURIComponent(q)}" class="pagination-link">${i}</a>`;
                        }
                    }

                    if (data.has_next) {
                        pagHtml += `<a href="index.html?page=${data.next_num}&q=${encodeURIComponent(q)}" class="pagination-link">Próxima <i class="fas fa-chevron-right ms-1"></i></a>`;
                    }
                }
                pagContainer.innerHTML = pagHtml;

            } catch (error) {
                console.error(error);
                grid.innerHTML = `
                    <div class="text-center py-5 w-100 grid-full-width text-danger">
                        <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                        <h3>Erro ao carregar produtos</h3>
                        <p>Verifique se o backend está rodando em ${API_URL}.</p>
                    </div>
                `;
                pagContainer.innerHTML = '';
            }
        }
    </script>
</body>
</html>
