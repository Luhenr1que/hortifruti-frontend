<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel de Produtos - Hortifruti Premium</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>

    <!-- NAVBAR PLACEHOLDER -->
    <div id="navbar-placeholder"></div>

    <!-- CONTEÚDO -->
    <div class="container mt-4 main-content">
        <h2 class="mb-4 fw-bold text-dark text-center">Painel de Gerenciamento</h2>

        <div class="d-flex justify-content-between mb-4 flex-wrap gap-2">
            <a href="admin.html" class="btn btn-success rounded-pill px-4 shadow-sm">
                <i class="fas fa-plus-circle me-2"></i> Cadastrar Novo Produto
            </a>
            <a href="index.html" class="btn btn-outline-secondary rounded-pill px-4">
                <i class="fas fa-arrow-left me-2"></i> Voltar à Vitrine
            </a>
        </div>

        <!-- BARRA DE BUSCA INTERNA -->
        <form id="search-form" class="mb-4">
            <div class="input-group shadow-sm rounded-pill overflow-hidden">
                <input type="text" id="busca" class="form-control border-0 ps-4 py-2" placeholder="Buscar produto...">
                <button class="btn btn-primary px-4" type="submit">Buscar</button>
            </div>
        </form>

        <div id="loading-spinner" class="text-center py-5">
            <div class="spinner-border text-success" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
        </div>

        <div id="produtos-lista-container">
            <!-- Os cards dos produtos serão carregados dinamicamente aqui -->
        </div>
    </div>

    <!-- FOOTER PLACEHOLDER -->
    <div id="footer-placeholder"></div>

    <!-- CART PLACEHOLDER -->
    <div id="cart-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/layout.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // Proteção de rota
            const user = await checkAuth();
            if (!user || !user.admin) {
                alert("Acesso negado. Apenas administradores.");
                window.location.href = "login.html";
                return;
            }

            carregarProdutosPainel();

            const searchForm = document.getElementById("search-form");
            searchForm.addEventListener("submit", (e) => {
                e.preventDefault();
                const busca = document.getElementById("busca").value;
                carregarProdutosPainel(busca);
            });
        });

        async function carregarProdutosPainel(busca = '') {
            const container = document.getElementById("produtos-lista-container");
            const spinner = document.getElementById("loading-spinner");
            
            spinner.style.display = 'block';
            container.innerHTML = '';

            try {
                // Busca de produtos do backend (usamos paginação desativada ou uma página grande, 
                // para o painel de admin buscamos até 100 de uma vez para simplificar)
                const response = await fetch(`${API_URL}/api/produtos?q=${encodeURIComponent(busca)}&page=1`);
                if (!response.ok) throw new Error("Erro ao buscar produtos");

                const data = await response.json();
                spinner.style.display = 'none';

                if (data.produtos.length === 0) {
                    container.innerHTML = `
                        <div class="alert alert-info text-center">Nenhum produto cadastrado ou correspondente à busca.</div>
                    `;
                    return;
                }

                let html = '';
                data.produtos.forEach(p => {
                    const imagemUrl = p.imagem 
                        ? `${API_URL}/static/imagens/${p.imagem}` 
                        : `${API_URL}/static/imagens/sem-imagem.png`;

                    html += `
                        <div class="card mb-3 p-3 shadow-sm border-0 rounded-4">
                            <div class="row align-items-center">
                                <div class="col-md-2 text-center text-md-start mb-3 mb-md-0">
                                    <img src="${imagemUrl}" class="img-fluid rounded shadow-sm" style="max-height: 100px; object-fit: cover;" alt="${p.nome}">
                                </div>
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <h5 class="fw-bold mb-1">${p.nome}</h5>
                                    <p class="text-muted small mb-1">${p.descricao || 'Sem descrição.'}</p>
                                    <p class="fw-bold text-success mb-0">
                                        R$ ${parseFloat(p.preco).toFixed(2).replace('.', ',')}
                                    </p>
                                </div>
                                <div class="col-md-4 text-center text-md-end">
                                    <a href="editar.html?id=${p.id}" class="btn btn-warning rounded-pill px-3 py-1 me-1">
                                        <i class="fas fa-edit me-1"></i> Editar
                                    </a>
                                    <button onclick="deletarProduto(${p.id}, '${p.nome}')" class="btn btn-danger rounded-pill px-3 py-1">
                                        <i class="fas fa-trash-alt me-1"></i> Deletar
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;

            } catch (error) {
                console.error(error);
                spinner.style.display = 'none';
                container.innerHTML = `
                    <div class="alert alert-danger text-center">Erro ao conectar com o servidor do backend.</div>
                `;
            }
        }

        async function deletarProduto(id, nome) {
            if (!confirm(`Tem certeza de que deseja deletar o produto "${nome}"?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/produtos/${id}`, {
                    method: "DELETE",
                    headers: {
                        ...getAuthHeaders()
                    }
                });

                if (response.ok) {
                    // Recarregar os produtos
                    const busca = document.getElementById("busca").value;
                    carregarProdutosPainel(busca);
                } else {
                    const data = await response.json();
                    alert(data.erro || "Erro ao deletar produto.");
                }
            } catch (error) {
                console.error(error);
                alert("Erro de conexão ao tentar deletar o produto.");
            }
        }
    </script>
</body>
</html>
