<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar Produto - Hortifruti Premium</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>

    <!-- NAVBAR PLACEHOLDER -->
    <div id="navbar-placeholder"></div>

    <!-- CONTEÚDO -->
    <div class="container mt-4 main-content" style="max-width: 600px;">
        <div class="card shadow p-4 rounded-4 border-0">
            <h2 class="fw-bold mb-4 text-dark text-center">Cadastrar Produto</h2>
            
            <div class="mb-4 d-flex justify-content-between">
                <a href="index.html" class="btn btn-sm btn-outline-secondary rounded-pill px-3"><i class="fas fa-home me-1"></i> Home</a>
                <a href="admin_produtos.html" class="btn btn-sm btn-outline-primary rounded-pill px-3"><i class="fas fa-tasks me-1"></i> Gerenciar Produtos</a>
            </div>

            <div id="alert-container"></div>

            <form id="product-form" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nome do Produto</label>
                    <input name="nome" id="nome" placeholder="Nome" class="form-control rounded-3" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Descrição</label>
                    <textarea name="descricao" id="descricao" placeholder="Descrição" class="form-control rounded-3" rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Preço</label>
                    <input name="preco" id="preco" placeholder="Ex: 8.50" class="form-control rounded-3" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Imagem do Produto</label>
                    <input type="file" name="imagem" id="imagem" class="form-control rounded-3">
                </div>

                <button class="btn btn-success w-100 rounded-pill py-2 shadow-sm fw-bold">Cadastrar</button>
            </form>
        </div>
    </div>

    <!-- FOOTER PLACEHOLDER -->
    <div id="footer-placeholder"></div>

    <!-- CART PLACEHOLDER -->
    <div id="cart-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/layout.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // Proteção de rota
            const user = await checkAuth();
            if (!user || !user.admin) {
                alert("Acesso negado. Apenas administradores.");
                window.location.href = "login.html";
                return;
            }

            const form = document.getElementById("product-form");
            form.addEventListener("submit", cadastrarProduto);
        });

        async function cadastrarProduto(event) {
            event.preventDefault();
            const alertContainer = document.getElementById("alert-container");
            alertContainer.innerHTML = '';

            const formData = new FormData();
            formData.append("nome", document.getElementById("nome").value);
            formData.append("descricao", document.getElementById("descricao").value);
            formData.append("preco", document.getElementById("preco").value);
            
            const fileInput = document.getElementById("imagem");
            if (fileInput.files.length > 0) {
                formData.append("imagem", fileInput.files[0]);
            }

            try {
                const response = await fetch(`${API_URL}/api/produtos`, {
                    method: "POST",
                    headers: {
                        ...getAuthHeaders() // JWT / Session token
                    },
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    alertContainer.innerHTML = `
                        <div class="alert alert-success rounded-3 small py-2">Produto cadastrado com sucesso!</div>
                    `;
                    setTimeout(() => {
                        window.location.href = "admin_produtos.html";
                    }, 1500);
                } else {
                    alertContainer.innerHTML = `
                        <div class="alert alert-danger rounded-3 small py-2">${data.erro || "Erro ao cadastrar o produto."}</div>
                    `;
                }
            } catch (error) {
                console.error(error);
                alertContainer.innerHTML = `
                    <div class="alert alert-danger rounded-3 small py-2">Não foi possível conectar ao servidor.</div>
                `;
            }
        }
    </script>
</body>
</html>
